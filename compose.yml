services:
  # This requires changes to rfd-site which will be proposed via PR.
  # rfd-site:
  rfd-site:
    build:
      context: https://github.com/oxidecomputer/rfd-site.git
      dockerfile: Containerfile
    image: localhost/rfd-site-test:latest
    networks:
      - rfd
    ports:
      - "3000:3000"
    environment:
      RFD_API_BACKEND_URL: http://rfd-api:8080
      RFD_API_FRONTEND_URL: http://localhost:8080
      RFD_API_GITHUB_CALLBACK_URL: http://localhost:3000/auth/github/callback
      AUTH_PROVIDERS: github
      STORAGE_PROVIDER: s3
      TELEMETRY_DISABLE: true
    secrets:
      - SESSION_SECRET
      - S3_BUCKET
      - AWS_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - GITHUB_HOST
      - GITHUB_REPO_CLIENT_ID
      - GITHUB_REPO_CLIENT_SECRET

  rfd-migration:
    build:
      dockerfile: Containerfile
    image: localhost/rfd-api-test:latest
    networks:
      - rfd
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: []
    working_dir: /home/rfd/db
    environment:
      - DATABASE_URL=postgres://rfd:rfd@postgres/rfd
    command: /usr/local/bin/rfd-installer && diesel migration run && echo "Migrations Complete!"

  rfd-api:
    image: localhost/rfd-api-test:latest
    # Uses default CMD: rfd-api
    ports:
      - "8080:8080"
    environment:
      # - RFD_API_CONFIG=/config/rfd-api.toml
      - DATABASE_URL=postgres://rfd:rfd@postgres/rfd
    secrets:
      - JWT_PRIVATE_KEY
      - JWT_PUBLIC_KEY
      - MEILI_MASTER_KEY
      - RFD_GITHUB_APP_ID
      - RFD_GITHUB_INSTALLATION_ID
      - RFD_GITHUB_PRIVATE_KEY
      - RFD_GITHUB_OWNER
      - RFD_GITHUB_REPO
      - RFD_GITHUB_PATH
      - RFD_GITHUB_DEFAULT_BRANCH
    command:
      - /bin/sh
      - -c
      - |
        app_id=$$(cat /run/secrets/RFD_GITHUB_APP_ID)
        installation_id=$$(cat /run/secrets/RFD_GITHUB_INSTALLATION_ID)
        case "$$app_id" in ""|*[!0-9]*) echo "RFD_GITHUB_APP_ID must be numeric" >&2; exit 1;; esac
        case "$$installation_id" in ""|*[!0-9]*) echo "RFD_GITHUB_INSTALLATION_ID must be numeric" >&2; exit 1;; esac
        cp /config/rfd-api.toml /tmp/rfd-api.toml
        sed -i \
          -e "s/^app_id = .*/app_id = $$app_id/" \
          -e "s/^installation_id = .*/installation_id = $$installation_id/" \
          /tmp/rfd-api.toml
        exec env \
          "services.github.owner=$$(cat /run/secrets/RFD_GITHUB_OWNER)" \
          "services.github.repo=$$(cat /run/secrets/RFD_GITHUB_REPO)" \
          "services.github.path=$$(cat /run/secrets/RFD_GITHUB_PATH)" \
          "services.github.default_branch=$$(cat /run/secrets/RFD_GITHUB_DEFAULT_BRANCH)" \
          /usr/local/bin/rfd-api /tmp/rfd-api.toml
    volumes:
      - ./compose/config.toml:/config/rfd-api.toml:ro
      - ./compose/mappers.toml:/config/mappers.toml:ro
    networks:
      - rfd
    depends_on:
      postgres:
        condition: service_started
      meilisearch:
        condition: service_started
      rfd-migration:
        condition: service_completed_successfully

  rfd-processor:
    image: localhost/rfd-api-test:latest

    # Override CMD to run rfd-processor instead
    environment:
      # - RFD_API_CONFIG=/config/rfd-api.toml
      - DATABASE_URL=postgres://rfd:rfd@postgres/rfd
    secrets:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - MEILI_MASTER_KEY
      - RFD_GITHUB_APP_ID
      - RFD_GITHUB_INSTALLATION_ID
      - RFD_GITHUB_PRIVATE_KEY
      - RFD_GITHUB_OWNER
      - RFD_GITHUB_REPO
      - RFD_GITHUB_PATH
      - RFD_GITHUB_DEFAULT_BRANCH
    command:
      - /bin/sh
      - -c
      - |
        app_id=$$(cat /run/secrets/RFD_GITHUB_APP_ID)
        installation_id=$$(cat /run/secrets/RFD_GITHUB_INSTALLATION_ID)
        case "$$app_id" in ""|*[!0-9]*) echo "RFD_GITHUB_APP_ID must be numeric" >&2; exit 1;; esac
        case "$$installation_id" in ""|*[!0-9]*) echo "RFD_GITHUB_INSTALLATION_ID must be numeric" >&2; exit 1;; esac
        cp /config/rfd-processor.toml /tmp/rfd-processor.toml
        sed -i \
          -e "s/^app_id = .*/app_id = $$app_id/" \
          -e "s/^installation_id = .*/installation_id = $$installation_id/" \
          /tmp/rfd-processor.toml
        exec env \
          "source.owner=$$(cat /run/secrets/RFD_GITHUB_OWNER)" \
          "source.repo=$$(cat /run/secrets/RFD_GITHUB_REPO)" \
          "source.path=$$(cat /run/secrets/RFD_GITHUB_PATH)" \
          "source.default_branch=$$(cat /run/secrets/RFD_GITHUB_DEFAULT_BRANCH)" \
          /usr/local/bin/rfd-processor /tmp/rfd-processor.toml
    volumes:
      - ./compose/rfd-processor.config.toml:/config/rfd-processor.toml:ro
    networks:
      - rfd
    depends_on:
      postgres:
        condition: service_started
      meilisearch:
        condition: service_started
      rfd-migration:
        condition: service_completed_successfully

  postgres:
    image: docker.io/postgres:18-trixie
    environment:
      POSTGRES_USER: rfd
      POSTGRES_PASSWORD: rfd
      POSTGRES_DB: rfd
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - rfd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfd"]
      start_period: 5s
      start_interval: 1s
      retries: 10
      interval: 5s

  meilisearch:
    image: docker.io/getmeili/meilisearch:v1.11
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_DB_PATH: /meili_data/data.ms
    secrets:
      - MEILI_MASTER_KEY
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "7700:7700"
    networks:
      - rfd

networks:
  rfd:
    driver: bridge

volumes:
  postgres_data:
  meilisearch_data:

secrets:
  AWS_ACCESS_KEY_ID:
    external: true
  AWS_REGION:
    external: true
  AWS_SECRET_ACCESS_KEY:
    external: true
  AWS_SESSION_TOKEN:
    external: true
  GITHUB_HOST:
    external: true
  GITHUB_REPO_CLIENT_ID:
    external: true
  GITHUB_REPO_CLIENT_SECRET:
    external: true
  JWT_PRIVATE_KEY:
    external: true
  JWT_PUBLIC_KEY:
    external: true
  MEILI_MASTER_KEY:
    external: true
  RFD_GITHUB_APP_ID:
    external: true
  RFD_GITHUB_INSTALLATION_ID:
    external: true
  RFD_GITHUB_PRIVATE_KEY:
    external: true
  RFD_GITHUB_OWNER:
    external: true
  RFD_GITHUB_REPO:
    external: true
  RFD_GITHUB_PATH:
    external: true
  RFD_GITHUB_DEFAULT_BRANCH:
    external: true
  S3_BUCKET:
    external: true
  SESSION_SECRET:
    external: true
